# wa2dc-unified: build and publish a GitHub Release when a tag such as
# unified-v2.7.0 is pushed. See docs/unified/ for the release guide.
name: Unified release

on:
  push:
    tags: ["unified-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing unified-v* tag to (re)build
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ^24.22.1
          check-latest: true
          cache: npm
      - name: Tag must match package.json version
        run: test "$TAG" = "unified-v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm run ci:check
      - run: npm test
      - run: npm --prefix bridges/osdc-wa ci
      - run: npm --prefix bridges/osdc-wa test

  hummus:
    needs: verify
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, asset: hummus-linux-x64 }
          - { os: ubuntu-24.04-arm, asset: hummus-linux-arm64 }
          - { os: windows-2025, asset: hummus-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: bridges/hummus/go.mod
          cache-dependency-path: bridges/hummus/go.sum
      - name: Build
        working-directory: bridges/hummus
        run: go build -trimpath -ldflags "-s -w" -o "../../${{ matrix.asset }}" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: [verify, hummus]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Source archives and checksums
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix="wa2dc-unified-${TAG#unified-v}/" -o "dist/wa2dc-unified-${TAG#unified-v}-source.tar.gz" "$TAG"
          git archive --format=zip --prefix="wa2dc-unified-${TAG#unified-v}/" -o "dist/wa2dc-unified-${TAG#unified-v}-source.zip" "$TAG"
          cp deploy/linux/install-linux_*.sh deploy/windows/install-windows_*.ps1 dist/
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="docs/unified/release-notes/${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "wa2dc-unified ${TAG#unified-v}" --notes-file "$notes"
          fi

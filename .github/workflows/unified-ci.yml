# wa2dc-unified: CI for the two bridges imported under bridges/.
# The main bridge (repository root) is covered by ci.yml.
name: Unified bridges CI

on:
  pull_request:
    branches: [main, next]
  push:
    branches: [main, next]

permissions:
  contents: read

concurrency:
  group: unified-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  osdc-wa:
    name: bridges/osdc-wa (Node)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bridges/osdc-wa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridges/osdc-wa/package-lock.json
      - run: npm ci
      - run: npm test

  hummus:
    name: bridges/hummus (Go, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bridges/hummus
    env:
      CGO_ENABLED: "1" # go-sqlite3 needs cgo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: bridges/hummus/go.mod
          cache-dependency-path: bridges/hummus/go.sum
      - run: go vet ./...
      - run: go build ./...

  deploy-scripts:
    name: deploy/ scripts lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Shell syntax and shellcheck
        run: |
          set -euo pipefail
          for f in deploy/linux/*.sh scripts/*.sh; do bash -n "$f"; done
          shellcheck --severity=warning deploy/linux/*.sh
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem deploy/windows/*.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" }; $failed = $true }
          }
          if ($failed) { exit 1 }
